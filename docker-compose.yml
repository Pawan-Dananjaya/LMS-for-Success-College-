services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: lms-app:latest
    container_name: lms_app
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "1"
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/laravel.ini:ro
    entrypoint: ["/bin/sh", "/var/www/html/docker/php/entrypoint.sh"]
    command: ["php-fpm"]
    networks:
      - lms

  web:
    image: nginx:1.25-alpine
    container_name: lms_web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lms

  db:
    image: mysql:8.0
    container_name: lms_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lms
      MYSQL_USER: lms
      MYSQL_PASSWORD: lms
      MYSQL_ROOT_PASSWORD: root
    command: ["--default-authentication-plugin=mysql_native_password"]
    ports:
      - "3309:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - lms

  node:
    image: node:18-alpine
    container_name: lms_node
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - app
    networks:
      - lms

volumes:
  dbdata:

networks:
  lms:
